    <circle cx="450" cy="450" r="260" stroke-opacity=".12"/>
  </g>
  <g fill="#8EC5E5" fill-opacity=".72">
    <circle cx="450" cy="143" r="3"/><circle cx="757" cy="450" r="3"/>
    <circle cx="450" cy="757" r="3"/><circle cx="143" cy="450" r="3"/>
  </g>

