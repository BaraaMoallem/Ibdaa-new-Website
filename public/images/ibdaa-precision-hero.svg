  <path d="M146 529l30-7m562-199 29-9M445 827v-30" stroke="#5CC9CD" stroke-opacity=".85" stroke-width="2"/>
  <g stroke="#8EC5E5" stroke-opacity=".75" stroke-width="1.5">
    <circle cx="229" cy="281" r="8"/><path d="M229 265v-13m0 45v13m-24-29h-13m61 0h13"/>
    <circle cx="658" cy="607" r="8"/><path d="M658 591v-13m0 45v13m-24-29h-13m61 0h13"/>
