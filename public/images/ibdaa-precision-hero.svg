    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#B9D9E7" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="193" y="180" width="576" height="586" filterUnits="userSpaceOnUse">
