  <path d="M290 281c-9-54 11-104 48-133 42-33 82-26 117-8 32 17 48 17 78 2 50-25 102-19 140 18 45 44 55 96 43 151l-44 259c-13 78-73 138-158 159-44 11-88 9-128-4-83-26-132-88-140-171l-24-273Z" stroke="#63BBC7" stroke-opacity=".23" stroke-width="2" stroke-dasharray="5 10"/>
