<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" fill="none">
  <defs>
    <linearGradient id="ground" x1="72" y1="80" x2="820" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102A47"/>
      <stop offset=".53" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#153B57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(476 425) rotate(90) scale(438 425)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3C85A3" stop-opacity=".4"/>
      <stop offset="1" stop-color="#1E3A5F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceramic" x1="312" y1="211" x2="629" y2="698" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".2" stop-color="#ECF8FC"/>
      <stop offset=".5" stop-color="#A8D2E5"/>
      <stop offset=".72" stop-color="#5E9ABA"/>
      <stop offset="1" stop-color="#27678A"/>
    </linearGradient>
    <linearGradient id="ceramicEdge" x1="392" y1="286" x2="687" y2="616" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFE4F1"/>
      <stop offset=".46" stop-color="#4E8EAD"/>
      <stop offset="1" stop-color="#173F62"/>
    </linearGradient>
    <linearGradient id="sheen" x1="266" y1="277" x2="559" y2="551" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".84"/>
      <stop offset=".45" stop-color="white" stop-opacity=".19"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="170" y1="589" x2="708" y2="220" gradientUnits="userSpaceOnUse">
