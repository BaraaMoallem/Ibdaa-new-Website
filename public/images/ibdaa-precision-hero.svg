  <path d="M307 288c-10-48 5-91 41-115 34-23 72-21 104-6 29 14 45 15 75 1 44-21 87-17 117 15 35 38 43 76 35 120l-42 263c-12 73-66 127-143 144-36 8-76 6-110-6-68-24-107-76-115-150l-19-266Z" fill="url(#ceramicEdge)" stroke="#C6E9F2" stroke-opacity=".66" stroke-width="2"/>
  <path d="M273 272c-8-47 7-85 41-108 33-22 70-20 101-5 30 15 49 15 77 1 43-22 87-16 117 15 34 36 41 75 34 117l-39 257c-11 69-64 121-136 137-36 8-75 6-107-6-67-24-105-73-112-142l-18-266Z" fill="url(#ceramic)" stroke="#F3FCFD" stroke-width="2"/>
