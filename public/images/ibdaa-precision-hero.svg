  <path d="M271 294c35 8 72 29 101 62 23 26 35 66 41 115 7 55 19 112 54 192" stroke="white" stroke-opacity=".38" stroke-width="4" stroke-linecap="round"/>
  <path d="M438 194c-14 44-22 91-15 136m25-138c-4 36-6 76-3 112m150-89c-29 13-60 42-78 79-25 51-30 115-31 162" stroke="white" stroke-opacity=".31" stroke-width="2" stroke-linecap="round"/>
  <path d="M280 493c37 75 97 124 168 127 79 4 142-34 177-100" stroke="#DDF5F8" stroke-opacity=".31" stroke-width="2"/>
  <path d="M258 552c56 89 119 130 205 130 89 0 146-46 179-125" stroke="#123C5D" stroke-opacity=".32" stroke-width="2"/>

