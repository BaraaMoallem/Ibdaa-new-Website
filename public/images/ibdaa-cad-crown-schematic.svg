  </defs>

  <path fill="url(#navy)" d="M0 0h1000v1000H0z"/>
  <path fill="url(#focus)" d="M0 0h1000v1000H0z"/>

  <!-- Sparse drafting guides leave a quiet margin around the central study. -->
