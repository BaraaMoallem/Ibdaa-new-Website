<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="navy" x1="74" y1="52" x2="934" y2="974" gradientUnits="userSpaceOnUse">
      <stop stop-color="#234269"/>
      <stop offset=".52" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#173250"/>
    </linearGradient>
    <radialGradient id="focus" cx="0" cy="0" r="1" gradientTransform="translate(500 503) rotate(90) scale(415 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78B9D3" stop-opacity=".11"/>
      <stop offset="1" stop-color="#78B9D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="338" y1="344" x2="665" y2="707" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDE5F4" stop-opacity=".17"/>
      <stop offset=".55" stop-color="#8EC5E5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#24A1A5" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="outline" x1="324" y1="397" x2="691" y2="628" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91CBE8"/>
      <stop offset=".5" stop-color="#CEEAF5"/>
      <stop offset="1" stop-color="#89C6E3"/>
    </linearGradient>
    <pattern id="panelGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#A9D7E8" stroke-opacity=".1"/>
    </pattern>
    <clipPath id="panelClip">
      <path d="M215 265h570v490H215z"/>
